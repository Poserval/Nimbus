<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nimbus - Вход и регистрация</title>
    <link rel="stylesheet" href="style-reg.css">
</head>
<body>
    <div class="bg-overlay"></div>
    
    <div class="container">
        <div class="logo-area">
            <img src="../assets/cloud-icon.png" alt="Nimbus">
            <h1>NIMBUS</h1>
            <p>Cloud Manager</p>
        </div>

        <div class="auth-container">
            <div class="tabs">
                <button class="tab-btn active" data-tab="login">Вход</button>
                <button class="tab-btn" data-tab="register">Регистрация</button>
            </div>

            <!-- Форма входа -->
            <div class="tab-content active" id="loginTab">
                <div class="form-group">
                    <input type="email" id="loginEmail" placeholder="Email">
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="Пароль">
                </div>
                <button id="doLoginBtn" class="auth-btn primary">Войти</button>
            </div>

            <!-- Форма регистрации -->
            <div class="tab-content" id="registerTab">
                <div class="form-group">
                    <input type="text" id="regName" placeholder="Имя (как будет отображаться)">
                </div>
                <div class="form-group">
                    <input type="email" id="regEmail" placeholder="Email">
                </div>
                <div class="form-group">
                    <input type="password" id="regPassword" placeholder="Пароль (мин. 6 символов)">
                </div>
                <div class="form-group">
                    <input type="password" id="regPasswordConfirm" placeholder="Подтверждение пароля">
                </div>
                <button id="doRegisterBtn" class="auth-btn primary">Зарегистрироваться</button>
            </div>

            <!-- Убрали ярлыки Google и Яндекс -->
        </div>

        <div class="info-text">
            <p>После регистрации вы сможете добавлять облачные хранилища</p>
        </div>
    </div>

    <script>
        // ========== РАБОТА С СЕРВЕРОМ ==========
        
        async function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regPasswordConfirm').value;
            
            if (!name || !email || !password) {
                alert('Заполните все поля');
                return;
            }
            if (password.length < 6) {
                alert('Пароль должен быть не менее 6 символов');
                return;
            }
            if (password !== confirm) {
                alert('Пароли не совпадают');
                return;
            }
            
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('nimbus_auth', JSON.stringify({
                        email: email,
                        name: name,
                        expires: Date.now() + 30 * 24 * 60 * 60 * 1000
                    }));
                    alert('Регистрация успешна!');
                    window.location.href = '../index.html';
                } else {
                    alert('Ошибка: ' + data.error);
                }
            } catch (err) {
                console.error('Register error:', err);
                alert('Ошибка соединения с сервером');
            }
        }
        
        async function loginUser() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                alert('Введите email и пароль');
                return;
            }
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('nimbus_auth', JSON.stringify({
                        email: email,
                        name: data.name || email.split('@')[0],
                        expires: Date.now() + 30 * 24 * 60 * 60 * 1000
                    }));
                    alert('Вход выполнен!');
                    window.location.href = '../index.html';
                } else {
                    alert('Ошибка: ' + data.error);
                }
            } catch (err) {
                console.error('Login error:', err);
                alert('Ошибка соединения с сервером');
            }
        }

        // ========== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ==========
        function initTabs() {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.dataset.tab;
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    document.querySelectorAll('.tab-content').forEach(content => {
                        content.classList.remove('active');
                    });
                    document.getElementById(`${tabId}Tab`).classList.add('active');
                });
            });
        }
        
        // ========== ПРОВЕРКА УЖЕ АВТОРИЗОВАННЫХ ==========
        function checkAuth() {
            const auth = JSON.parse(localStorage.getItem('nimbus_auth') || 'null');
            if (auth && auth.expires > Date.now()) {
                if (confirm('Вы уже авторизованы. Перейти на главную?')) {
                    window.location.href = '../index.html';
                }
            }
        }
        
        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        function init() {
            initTabs();
            checkAuth();
            
            document.getElementById('doRegisterBtn').onclick = registerUser;
            document.getElementById('doLoginBtn').onclick = loginUser;
            
            // Enter для отправки
            document.getElementById('loginPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loginUser();
            });
            document.getElementById('regPasswordConfirm').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') registerUser();
            });
        }
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
